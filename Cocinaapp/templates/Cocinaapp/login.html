<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLunch | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow border-0" style="width: 100%; max-width: 400px;">

            <div class="card-header text-center text-white py-4" style="background-color: #1f2937;">
                <h2 class="mb-0 fw-bold">Quick<span style="color: #fb923c;">Lunch</span></h2>
                <small class="text-secondary">Módulo de Cocina</small>
            </div>

            <div class="card-body p-4">
                <h1 class="h5 mb-1">Iniciar sesión</h1>
                <p class="text-muted small mb-4">Ingresa tus credenciales para continuar.</p>

                {% if form.errors %}
                    <div class="alert alert-danger py-2" role="alert">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Usuario</label>
                        <input type="text" name="username" id="id_username"
                               class="form-control" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Contraseña</label>
                        <input type="password" name="password" id="id_password"
                               class="form-control" required>
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <button type="submit" class="btn w-100 text-white fw-bold"
                            style="background-color: #ea580c;">
                        Entrar
                    </button>
                </form>
            </div>

        </div>
    </div>

</body>
</html>
